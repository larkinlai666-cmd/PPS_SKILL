name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python tools/validate_skill.py
          bash tests/smoke.sh
      - name: Package skill
        run: |
          mkdir -p dist
          cd skills
          zip -r "../dist/pps-skill-${GITHUB_REF_NAME}.zip" pps-skill
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/pps-skill-${GITHUB_REF_NAME}.zip" --generate-notes
