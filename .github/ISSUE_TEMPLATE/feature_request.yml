name: Feature request
description: Propose a new workflow, profile, validator, or compatibility improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the real proposal-project failure or maintenance cost.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Explain how existing PPS projects would behave.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Design fit
      options:
        - label: The proposal preserves explicit authority and workset retrieval.
          required: true
        - label: The proposal does not require hosted infrastructure by default.
          required: true
